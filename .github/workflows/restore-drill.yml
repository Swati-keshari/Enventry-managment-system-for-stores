name: Restore Drill

on:
  workflow_dispatch:
    inputs:
      backup_path:
        description: "Backup artifact path or 'latest'"
        required: true
        default: "latest"
  schedule:
    # Quarterly: 1st of Jan, Apr, Jul, Oct at 02:00 UTC
    - cron: "0 2 1 1,4,7,10 *"

env:
  NODE_VERSION: "20"

jobs:
  restore-drill:
    name: Backup Restore Drill
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_TEST_ANON_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_TEST_SERVICE_ROLE_KEY }}
      BASE_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run smoke queries against backup
        run: |
          echo "## Restore Drill Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Timestamp:** $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "**Backup:** ${{ inputs.backup_path || 'latest' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Smoke queries
          echo "### Smoke Queries" >> $GITHUB_STEP_SUMMARY
          echo "Checking table counts..." >> $GITHUB_STEP_SUMMARY

      - name: Run RLS isolation tests
        run: npx vitest run tests/integration/02-rls-tenant-isolation.test.ts --reporter=verbose 2>&1 | tee drill-rls.txt
        continue-on-error: true

      - name: Run audit integrity tests
        run: npx vitest run tests/integration/06-audit-integrity.test.ts --reporter=verbose 2>&1 | tee drill-audit.txt
        continue-on-error: true

      - name: Run dashboard golden tests
        run: npx vitest run tests/integration/07-dashboard-golden.test.ts --reporter=verbose 2>&1 | tee drill-dashboard.txt
        continue-on-error: true

      - name: Publish results
        if: always()
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Test Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ -f drill-rls.txt ]; then
            echo "**RLS Isolation:** $(grep -c '✓\|PASS' drill-rls.txt || echo 0) passed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f drill-audit.txt ]; then
            echo "**Audit Integrity:** $(grep -c '✓\|PASS' drill-audit.txt || echo 0) passed" >> $GITHUB_STEP_SUMMARY
          fi
          if [ -f drill-dashboard.txt ]; then
            echo "**Dashboard Math:** $(grep -c '✓\|PASS' drill-dashboard.txt || echo 0) passed" >> $GITHUB_STEP_SUMMARY
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Drill completed at:** $(date -u)" >> $GITHUB_STEP_SUMMARY

      - name: Upload drill artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: restore-drill-${{ github.run_number }}
          path: |
            drill-rls.txt
            drill-audit.txt
            drill-dashboard.txt
          retention-days: 90
